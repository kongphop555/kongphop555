<svg xmlns="http://www.w3.org/2000/svg" width="300" height="240" viewBox="0 0 300 240">
  <style>
    .t{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:11px}
    .c{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
    .f{animation:fl 3s ease-in-out infinite}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  </style>
  <!-- window -->
  <rect x="10" y="20" width="280" height="190" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="10" y="20" width="280" height="28" rx="10" fill="#161b22"/>
  <rect x="10" y="38" width="280" height="10" fill="#161b22"/>
  <circle cx="28" cy="34" r="5" fill="#ff5f56"/><circle cx="44" cy="34" r="5" fill="#ffbd2e"/><circle cx="60" cy="34" r="5" fill="#27c93f"/>
  <text class="t" x="150" y="38" fill="#8b949e" text-anchor="middle">kongphop.ts</text>
  <!-- code -->
  <g class="t">
    <text x="26" y="72"><tspan fill="#ff7b72">const</tspan><tspan fill="#d2a8ff"> me</tspan><tspan fill="#c9d1d9"> = {</tspan></text>
    <text x="40" y="92"><tspan fill="#79c0ff">role</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"Full-Stack Dev"</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="40" y="112"><tspan fill="#79c0ff">design</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">"UX"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"UI"</tspan><tspan fill="#c9d1d9">],</tspan></text>
    <text x="40" y="132"><tspan fill="#79c0ff">uni</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"MFU"</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="40" y="152"><tspan fill="#79c0ff">coffee</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#79c0ff">Infinity</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="26" y="172"><tspan fill="#c9d1d9">};</tspan><tspan class="c" fill="#7dd3fc"> ▋</tspan></text>
  </g>
  <!-- floating badge -->
  <g class="f">
    <rect x="196" y="150" width="84" height="44" rx="8" fill="#161b22" stroke="#7dd3fc" stroke-opacity="0.6"/>
    <rect x="206" y="160" width="24" height="24" rx="4" fill="none" stroke="#7dd3fc"/>
    <path d="M211 172 h14 M218 165 v14" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="236" y="163" width="34" height="4" rx="2" fill="#8b949e"/>
    <rect x="236" y="172" width="24" height="4" rx="2" fill="#30363d"/>
  </g>
</svg>
