<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#16161d"/>
      <stop offset="0.6" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="0.35" stop-color="#9aa3b5"/>
      <stop offset="0.75" stop-color="#2c3140"/>
      <stop offset="1" stop-color="#0d0f15"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <clipPath id="pc"><circle cx="640" cy="180" r="112"/></clipPath>
    <style>
      .tw{animation:tw 3s ease-in-out infinite}
      .tw2{animation:tw 4.5s ease-in-out infinite 1s}
      .tw3{animation:tw 2.2s ease-in-out infinite .5s}
      @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
      .orb{transform-origin:640px 180px;animation:spin 18s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .blink{animation:bl 1.1s steps(1) infinite}
      @keyframes bl{50%{opacity:0}}
      .name{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:34px;letter-spacing:12px;fill:#d4d7df}
      .small{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:12px;letter-spacing:3px;fill:#6b7280}
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="tw" cx="80" cy="50" r="1.4"/><circle class="tw2" cx="190" cy="120" r="1"/>
    <circle class="tw3" cx="300" cy="40" r="1.2"/><circle class="tw" cx="420" cy="300" r="1"/>
    <circle class="tw2" cx="520" cy="70" r="1.5"/><circle class="tw3" cx="760" cy="40" r="1"/>
    <circle class="tw" cx="860" cy="300" r="1.3"/><circle class="tw2" cx="980" cy="60" r="1"/>
    <circle class="tw3" cx="1090" cy="130" r="1.4"/><circle class="tw" cx="1200" cy="40" r="1"/>
    <circle class="tw2" cx="1230" cy="290" r="1.2"/><circle class="tw3" cx="60" cy="300" r="1"/>
    <circle class="tw" cx="250" cy="250" r="0.9"/><circle class="tw2" cx="1010" cy="250" r="0.9"/>
    <circle class="tw3" cx="350" cy="180" r="0.8"/><circle class="tw" cx="930" cy="170" r="0.8"/>
  </g>

  <!-- glow + planet -->
  <circle cx="640" cy="180" r="200" fill="url(#glow)"/>
  <circle cx="640" cy="180" r="112" fill="url(#planet)"/>
  <g clip-path="url(#pc)" opacity="0.5">
    <rect x="520" y="60" width="240" height="240" fill="url(#scan)"/>
    <path d="M528 150 Q640 130 752 160" stroke="#0d0f15" stroke-width="10" fill="none" opacity="0.35"/>
    <path d="M528 205 Q640 225 752 195" stroke="#0d0f15" stroke-width="7" fill="none" opacity="0.3"/>
  </g>
  <circle cx="640" cy="180" r="112" fill="none" stroke="#e5e7eb" stroke-opacity="0.25"/>

  <!-- orbit ring -->
  <ellipse cx="640" cy="180" rx="190" ry="42" fill="none" stroke="#9ca3af" stroke-opacity="0.35" transform="rotate(-14 640 180)"/>
  <g class="orb">
    <circle cx="830" cy="180" r="5" fill="#e0f2fe"/>
    <circle cx="830" cy="180" r="11" fill="#7dd3fc" opacity="0.25"/>
  </g>

  <!-- light streak -->
  <rect x="470" y="118" width="380" height="3" fill="url(#beam)" transform="rotate(-24 660 120)"/>

  <!-- name -->
  <text class="name" x="330" y="192" text-anchor="middle">KONGPHOP</text>
  <text class="name" x="955" y="192" text-anchor="middle">RUENTONGDI</text>

  <!-- HUD details -->
  <text class="small" x="40" y="335">&gt; SOFTWARE_ENGINEERING @ MFU<tspan class="blink" fill="#7dd3fc">_</tspan></text>
  <text class="small" x="1240" y="335" text-anchor="end">UX/UI · FRONTEND · BACKEND</text>
  <g stroke="#4b5563" stroke-width="1">
    <path d="M30 30 h28 M30 30 v28"/><path d="M1250 30 h-28 M1250 30 v28"/>
  </g>
  <g fill="#4b5563">
    <rect x="1120" y="230" width="60" height="2"/><rect x="1120" y="238" width="40" height="2"/><rect x="1120" y="246" width="50" height="2"/>
    <rect x="100" y="110" width="50" height="2"/><rect x="100" y="118" width="30" height="2"/>
  </g>
</svg>
